[package]
name = "file_tree_json"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ratatui = "0.28"
crossterm = "0.28"
ignore = "0.4.33"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[bin]]
name = "file_tree_json"
path = "src/main.rs"

[[bin]]
name = "file_tree_tui"
path = "src/tui.rs"
